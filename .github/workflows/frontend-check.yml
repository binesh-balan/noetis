name: Frontend Check

# Fast PR gate for the Next.js frontend: colour tokens, contrast, types, build.
# No Rust build; the Tauri app is built by the manual build workflows.

on:
  pull_request:
    paths:
      - "frontend/**"
      - "!frontend/src-tauri/**"
      - ".github/workflows/frontend-check.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ponytail: guarded so the same file works on branches that predate these scripts
      - name: Colour tokens
        run: |
          if [ -f scripts/check-colors.mjs ]; then node scripts/check-colors.mjs; else echo "skipped - no check-colors.mjs"; fi

      - name: Contrast
        run: |
          if [ -f scripts/check-contrast.mjs ]; then node scripts/check-contrast.mjs; else echo "skipped - no check-contrast.mjs"; fi

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
